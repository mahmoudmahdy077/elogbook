name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
# N6: no global warning suppression (NODE_NO_WARNINGS /
# VITE_CONFIG_NATIVE_IGNORE_WARNING are banned — fix or classify instead;
# the test job fails on unapproved warning/error lines, see check-test-log).
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.14.0', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.14.0', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:all
  static-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.14.0' }
      - name: Every mutating API route uses the shared request guard
        run: node scripts/verify-request-guards.mjs
      - name: Agent boundaries are intact
        run: node scripts/verify-agent-boundaries.mjs
      - name: Test inventory is complete
        run: node scripts/verify-test-inventory.mjs
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.14.0', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (raw log captured as artifact)
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.log
      - name: Warning gate (N6 — no unapproved warning/error lines)
        run: node scripts/check-test-log.mjs test-output.log
      - name: Upload raw test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-log
          path: test-output.log
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.14.0', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
  docker-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build production image (authoritative Dockerfile)
        run: docker build --build-arg "APP_RELEASE_COMMIT=${GITHUB_SHA}" --tag elogbook-web:boot --file apps/web/Dockerfile .
      - name: Assert non-root runtime user
        run: |
          set -euo pipefail
          test "$(docker inspect -f '{{.Config.User}}' elogbook-web:boot)" = "nextjs"
      - name: Misconfigured production boot must fail fast (non-zero exit)
        run: |
          set -euo pipefail
          # A crash also exits non-zero, so assert the VALIDATION message:
          # otherwise a broken image passes this gate vacuously.
          set +e
          out=$(docker run --rm -e NODE_ENV=production elogbook-web:boot 2>&1)
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            echo "::error::production boot without RATE_LIMIT_MODE exited 0; fail-fast broken"
            exit 1
          fi
          echo "$out" | grep -q "RATE_LIMIT_MODE" || {
            echo "::error::boot failed without the fail-fast validation message (broken image?)"
            echo "$out" | tail -5
            exit 1
          }
      - name: Boot with valid env and probe liveness/readiness
        run: |
          set -euo pipefail
          docker rm -f elogbook-boot 2>/dev/null || true
          trap 'docker rm -f elogbook-boot 2>/dev/null || true' EXIT
          docker run -d --name elogbook-boot -p 3000:3000 \
            -e NODE_ENV=production \
            -e NEXT_PUBLIC_SUPABASE_URL=https://dummy.supabase.co \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy-anon-key-for-boot-probe-only \
            -e SUPABASE_SERVICE_ROLE_KEY=dummy-service-key-for-boot-probe-only \
            -e NEXT_PUBLIC_SITE_URL=http://localhost:3000 \
            -e RATE_LIMIT_MODE=single-instance \
            -e TRUSTED_PROXY_HOPS=1 \
            elogbook-web:boot
          for i in $(seq 1 24); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 5
          done
          node scripts/verify-boot.mjs --probe-base-url=http://localhost:3000
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/setup/deploy-supabase -H 'Content-Type: application/json' -d '{}')" = "404"
          docker stop elogbook-boot || true
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2
        with: { version: 2.109.1 }
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ github.token }}
      - name: Start local Supabase (with retries)
        id: sbstart
        shell: bash
        run: |
          set -euo pipefail
          export SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io
          for i in 1 2 3; do
            if supabase start; then exit 0; fi
            echo "::warning::supabase start attempt $i failed; retrying in 30s"
            sleep 30
          done
          echo "::error::supabase start failed after 3 attempts"
          exit 1
      - name: Run DB isolation tests (maintained SQL inventory, non-legacy)
        shell: bash
        run: |
          set -euo pipefail
          supabase db test \
            supabase/tests/p1_1b_cross_tenant_write_isolation.sql \
            supabase/tests/p1_3_phi_deidentified_enforcement.sql \
            supabase/tests/p1_16_catalog_invariants.sql \
            supabase/tests/p1_17_legacy_rpc_containment.sql \
            supabase/tests/p1_18_principal_status_rls.sql \
            supabase/tests/p1_19_audit_secret_idempotency.sql \
            supabase/tests/p1_20_attachment_authorization.sql \
            supabase/tests/p1_21_policy_convergence.sql \
            supabase/tests/p1_22_email_safety_controls.sql \
            supabase/tests/p1_23_database_authorization_final.sql \
            supabase/tests/p1_24_ai_quota_reservations.sql \
            supabase/tests/p1_25_email_queue_claim.sql \
            supabase/tests/p1_26_privileged_aal2.sql \
            supabase/tests/p1_27_pending_profile_mfa.sql \
            supabase/tests/p1_28_sso_secret_containment.sql \
            supabase/tests/p1_29_stripe_event_claim.sql \
            supabase/tests/p1_30_attachment_scanner_gate.sql \
            supabase/tests/p1_31_email_operational_safety.sql \
            supabase/tests/p1_32_clinical_command_boundary.sql \
            supabase/tests/p1_33_billing_entitlement_authority.sql \
            supabase/tests/p1_34_save_case_draft_command.sql \
            supabase/tests/p1_35_consent_and_invitation_authority.sql \
            supabase/tests/p2_01_secret_views_role_gate.sql \
            supabase/tests/p2_02_rpc_tenant_checks.sql \
            supabase/tests/p2_03_duty_faculty_rls.sql \
            supabase/tests/p2_04_audit_and_notifications.sql \
            supabase/tests/p2_05_retention_v4.sql \
            supabase/tests/p2_06_analytics_rpc.sql \
            supabase/tests/p2_07_push_tokens_rls.sql \
            supabase/tests/p2_08_ai_quota_release.sql \
            supabase/tests/p2_09_role_destination_guard.sql \
            supabase/tests/p2_10_no_debug_artifacts.sql \
            supabase/tests/p2_11_platform_authority.sql \
            supabase/tests/p2_12_tenant_lifecycle.sql \
            supabase/tests/p2_13_data_mode_policy.sql \
            supabase/tests/p2_14_theme_revisions.sql \
            supabase/tests/p2_15_site_pages.sql \
            supabase/tests/p3_01_mobile_qualification_boundaries.sql \
            supabase/tests/p3_02_publish_contract.sql \
            supabase/tests/p3_03_case_operation_rpc.sql \
            supabase/tests/p3_04_mode_immutable.sql \
            supabase/tests/p3_05_definer_audit.sql
  e2e:
    runs-on: ubuntu-latest
    # Full-stack harness (T02). Runs only when the owner enables it and
    # provides a throwaway Supabase project + seeded E2E accounts; otherwise
    # the job is SKIPPED (never green without credentials).
    if: vars.E2E_ENABLED == 'true'
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      RATE_LIMIT_MODE: single-instance
      TRUSTED_PROXY_HOPS: '1'
      E2E_REQUIRE_AUTH: '1'
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.14.0', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @elogbook/web exec playwright install --with-deps chromium
      - run: pnpm build:web
      - name: Start production server
        run: |
          set -euo pipefail
          (pnpm --filter @elogbook/web start -p 3000 > /tmp/e2e-server.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 5
          done
          curl -fsS http://localhost:3000/api/health
      - name: Live boot probe (Gate C HTTP mode)
        run: node scripts/verify-boot.mjs --probe-base-url=http://localhost:3000
      - name: Run Playwright (authed harness, no fake-auth fallback)
        run: pnpm --filter @elogbook/web test:e2e
  deno-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with: { deno-version: v2.9.5 }
      - name: Check locked Deno source
        shell: bash
        run: deno check --frozen --config supabase/functions/payment-webhook/deno.json --lock supabase/functions/payment-webhook/deno.lock supabase/functions/payment-webhook/index.ts
      - name: Run Deno unit tests (isolated; lifecycle suite needs live Supabase and runs after `supabase start`)
        shell: bash
        run: |
          set -o pipefail
          deno test --frozen --config supabase/functions/payment-webhook/deno.json --lock supabase/functions/payment-webhook/deno.lock --allow-import --allow-net=localhost --allow-env supabase/functions/payment-webhook/index.test.ts 2>&1 | tail -n 20
      - name: Privileged Edge handlers keep the shared AAL2 guard
        shell: bash
        run: deno test --frozen --config supabase/functions/payment-webhook/deno.json --lock supabase/functions/payment-webhook/deno.lock --allow-read supabase/functions/privileged-auth.static.test.ts
