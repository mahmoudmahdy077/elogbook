name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
env:
  NODE_NO_WARNINGS: 1
  VITE_CONFIG_NATIVE_IGNORE_WARNING: 1
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:all
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
  docker-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image (authoritative Dockerfile)
        run: docker build --tag elogbook-web:boot --file apps/web/Dockerfile .
      - name: Assert non-root runtime user
        run: |
          set -euo pipefail
          test "$(docker inspect -f '{{.Config.User}}' elogbook-web:boot)" = "nextjs"
      - name: Misconfigured production boot must fail fast (non-zero exit)
        run: |
          set -euo pipefail
          if docker run --rm -e NODE_ENV=production elogbook-web:boot; then
            echo "::error::production boot without RATE_LIMIT_MODE exited 0; fail-fast broken"
            exit 1
          fi
      - name: Boot with valid env and probe liveness/readiness
        run: |
          set -euo pipefail
          docker run -d --name elogbook-boot -p 3000:3000 \
            -e NODE_ENV=production \
            -e NEXT_PUBLIC_SUPABASE_URL=https://dummy.supabase.co \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy-anon-key-for-boot-probe-only \
            -e SUPABASE_SERVICE_ROLE_KEY=dummy-service-key-for-boot-probe-only \
            -e NEXT_PUBLIC_SITE_URL=http://localhost:3000 \
            -e RATE_LIMIT_MODE=single-instance \
            -e TRUSTED_PROXY_HOPS=1 \
            elogbook-web:boot
          for i in $(seq 1 24); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 5
          done
          node scripts/verify-boot.mjs --probe-base-url=http://localhost:3000
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/setup/deploy-supabase -H 'Content-Type: application/json' -d '{}')" = "404"
          docker stop elogbook-boot
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with: { version: 2.109.1 }
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ github.token }}
      - name: Start local Supabase (with retries)
        id: sbstart
        shell: bash
        run: |
          set -euo pipefail
          export SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io
          for i in 1 2 3; do
            if supabase start; then exit 0; fi
            echo "::warning::supabase start attempt $i failed; retrying in 30s"
            sleep 30
          done
          echo "::error::supabase start failed after 3 attempts"
          exit 1
      - name: Run DB isolation tests (maintained SQL inventory, non-legacy)
        shell: bash
        run: |
          set -euo pipefail
          supabase db test supabase/tests/p1_1b_cross_tenant_write_isolation.sql supabase/tests/p1_3_phi_deidentified_enforcement.sql supabase/tests/p2_01_secret_views_role_gate.sql supabase/tests/p2_02_rpc_tenant_checks.sql supabase/tests/p2_03_duty_faculty_rls.sql supabase/tests/p2_04_audit_and_notifications.sql supabase/tests/p2_05_retention_v4.sql supabase/tests/p2_06_analytics_rpc.sql supabase/tests/p2_07_push_tokens_rls.sql supabase/tests/p2_08_ai_quota_release.sql supabase/tests/p2_09_role_destination_guard.sql supabase/tests/p2_10_no_debug_artifacts.sql supabase/tests/p2_11_platform_authority.sql supabase/tests/p2_12_tenant_lifecycle.sql
  e2e:
    runs-on: ubuntu-latest
    # Full-stack harness (T02). Runs only when the owner enables it and
    # provides a throwaway Supabase project + seeded E2E accounts; otherwise
    # the job is SKIPPED (never green without credentials).
    if: vars.E2E_ENABLED == 'true'
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      RATE_LIMIT_MODE: single-instance
      TRUSTED_PROXY_HOPS: '1'
      E2E_REQUIRE_AUTH: '1'
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @elogbook/web exec playwright install --with-deps chromium
      - run: pnpm build:web
      - name: Start production server
        run: |
          set -euo pipefail
          (pnpm --filter @elogbook/web start -p 3000 > /tmp/e2e-server.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 5
          done
          curl -fsS http://localhost:3000/api/health
      - name: Live boot probe (Gate C HTTP mode)
        run: node scripts/verify-boot.mjs --probe-base-url=http://localhost:3000
      - name: Run Playwright (authed harness, no fake-auth fallback)
        run: pnpm --filter @elogbook/web test:e2e
  deno-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Run Deno unit tests (isolated; lifecycle suite needs live Supabase and runs after `supabase start`)
        shell: bash
        run: |
          set -o pipefail
          deno test --no-lock --no-check --allow-import --allow-net=localhost --allow-env supabase/functions/payment-webhook/index.test.ts 2>&1 | tail -n 20
