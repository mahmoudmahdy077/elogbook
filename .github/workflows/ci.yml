name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
env:
  NODE_NO_WARNINGS: 1
  VITE_CONFIG_NATIVE_IGNORE_WARNING: 1
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:all
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with: { version: 2.109.1 }
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ github.token }}
      - name: Start local Supabase (with retries)
        id: sbstart
        shell: bash
        run: |
          set -euo pipefail
          export SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io
          for i in 1 2 3; do
            if supabase start; then exit 0; fi
            echo "::warning::supabase start attempt $i failed; retrying in 30s"
            sleep 30
          done
          echo "::error::supabase start failed after 3 attempts"
          exit 1
      - name: Run DB isolation tests (maintained SQL inventory, non-legacy)
        shell: bash
        run: |
          set -euo pipefail
          supabase db test supabase/tests/p1_1b_cross_tenant_write_isolation.sql supabase/tests/p1_3_phi_deidentified_enforcement.sql supabase/tests/p2_01_secret_views_role_gate.sql supabase/tests/p2_02_rpc_tenant_checks.sql supabase/tests/p2_03_duty_faculty_rls.sql supabase/tests/p2_04_audit_and_notifications.sql supabase/tests/p2_05_retention_v4.sql supabase/tests/p2_06_analytics_rpc.sql supabase/tests/p2_07_push_tokens_rls.sql supabase/tests/p2_08_ai_quota_release.sql
  deno-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Run Deno unit tests (isolated; lifecycle suite needs live Supabase and runs after `supabase start`)
        shell: bash
        run: |
          set -o pipefail
          deno test --no-lock --no-check --allow-import --allow-net=localhost --allow-env supabase/functions/payment-webhook/index.test.ts 2>&1 | tail -n 20
