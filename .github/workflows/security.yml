name: Security
on: [pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Audit (with documented image-size exception)
        run: |
          pnpm audit --audit-level=high --json > /tmp/audit.json || true
          # image-size (GHSA-1138808, GHSA-1138809) has no patched release
          # ("<0.0.0") and is a build-time dependency of metro (bundler
          # only — never executed on a server). Tracked upstream:
          # https://github.com/image-size/image-size/issues
          jq 'del(.advisories["1138808"], .advisories["1138809"])' /tmp/audit.json > /tmp/audit-filtered.json
          HIGH="$(jq '[.advisories | to_entries[] | select(.value.severity == "high")] | length' /tmp/audit-filtered.json)"
          echo "high-severity advisories remaining: ${HIGH}"
          if [ "${HIGH}" -gt 0 ]; then
            jq -r '.advisories | to_entries[] | select(.value.severity == "high") | "\(.key) \(.value.module_name) \(.value.url)"' /tmp/audit-filtered.json
            exit 1
          fi
