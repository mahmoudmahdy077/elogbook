name: Security
on: [pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Audit (with documented dev-toolchain exceptions)
        run: |
          pnpm audit --audit-level=high --json > /tmp/audit.json || true
          # Every exception below is a build/dev-toolchain package that never
          # ships in the web image or the mobile bundle. Application and
          # server dependencies are pinned past their fixed versions through
          # pnpm.overrides in package.json.
          #
          # 1138808, 1138809 - image-size (metro asset sizing)
          # 1239765, 1239766 - image-size; fixed only in v2, which metro's
          #                    ^1.2.0 range does not accept
          # 1240912          - node-forge, no patched release ("<0.0.0");
          #                    reached only through the Expo/Metro dev server
          # 1243066          - zod 3 as bundled inside @expo/cli; application
          #                    code is on zod 4.6.6
          jq 'del(.advisories["1138808"], .advisories["1138809"], .advisories["1239765"], .advisories["1239766"], .advisories["1240912"], .advisories["1243066"])' \
            /tmp/audit.json > /tmp/audit-filtered.json
          HIGH="$(jq '[.advisories | to_entries[] | select(.value.severity == "high")] | length' /tmp/audit-filtered.json)"
          echo "high-severity advisories remaining: ${HIGH}"
          if [ "${HIGH}" -gt 0 ]; then
            jq -r '.advisories | to_entries[] | select(.value.severity == "high") | "\(.key) \(.value.module_name) \(.value.url)"' /tmp/audit-filtered.json
            exit 1
          fi
