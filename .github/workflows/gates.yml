name: Gates
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.14.0', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Gate A — tenant-scope detector
        run: node scripts/verify-tenant-scope.mjs
      - name: Gate B — rate-limiter contract (via vitest)
        run: pnpm exec vitest run apps/web/lib/__tests__/rate-limit-contract.test.ts
      - name: Gate C — boot + compose + health/ready + setup guard
        run: node scripts/verify-boot.mjs
      - name: Gate D — security tests cannot vanish
        run: |
          node scripts/verify-test-inventory.mjs
          node scripts/verify-security-tests.mjs
      - name: Gate E — PHI claim guard
        run: node scripts/verify-phi-claim.mjs
      - name: Gate F — credential fail-closed
        run: node scripts/verify-credential-fail-closed.mjs
      - name: Gate G — single client-ip
        run: node scripts/verify-single-ip.mjs
      - name: Gate H — export compatibility
        run: node scripts/verify-exports.mjs
      - name: Token drift gate (T21 design contract)
        run: node scripts/verify-tokens.mjs
      - name: E2E harness self-check (T02)
        run: node scripts/verify-e2e-auth.mjs
