name: Set Demo Onboarding (temp)
on:
  workflow_dispatch:
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Mark demo profiles onboarding complete
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          q() { curl -sS -w "\nHTTP_CODE:%{http_code}\n" -X POST \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.management.v1+json" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -d "$1"; }
          q "{\"query\":\"UPDATE public.profiles SET onboarding_completed = true WHERE user_id IN (SELECT id FROM auth.users WHERE email LIKE '%@demo.com');\"}"
          echo "---VERIFY---"
          q "{\"query\":\"SELECT u.email, p.role, p.onboarding_completed FROM auth.users u JOIN public.profiles p ON p.user_id = u.id WHERE u.email LIKE '%@demo.com' ORDER BY u.email;\"}"
