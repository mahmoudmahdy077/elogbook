name: Build Mobile

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      staging_approved:
        description: Explicit approval after staging verification
        required: true
        type: boolean
        default: false
      staging_url:
        description: HTTPS URL for the canonical staging smoke test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: 'pnpm'
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: Type-check mobile app
        run: pnpm --filter @elogbook/mobile typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: 'pnpm'
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: Lint mobile app
        run: pnpm --filter @elogbook/mobile lint

  ledger-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
      # M0.4/N2.4: ledger schema, missing artifacts, forbidden certification
      # claims, unapproved console output, sensitive-write inventory.
      # R1 (Approach C): Sentry runtime/source-map consistency + fork/PR
      # safety are fail-closed gates here so PRs prove them without secrets.
      - name: Mobile ledger + hygiene gate
        run: |
          node scripts/check-mobile-ledger.mjs
          node scripts/check-mobile-adapters.mjs
          node scripts/check-sentry-consistency.mjs
          node scripts/check-mobile-workflow-safety.mjs
          node scripts/verify-mobile-security.mjs

  release:
    name: Delegate to protected release gate
    needs: [typecheck, lint, ledger-check]
    if: github.event_name == 'workflow_dispatch' && inputs.staging_approved == true
    uses: ./.github/workflows/release.yml
    with:
      staging_approved: ${{ inputs.staging_approved }}
      staging_url: ${{ inputs.staging_url }}
    secrets: inherit

  fork-validation:
    # N8 fork-safe path: no secrets, no EAS builds — static gates only.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: 'pnpm'
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: Type-check + lint + ledger gates (no credentials)
        run: |
          pnpm --filter @elogbook/mobile typecheck
          pnpm --filter @elogbook/mobile lint
          node scripts/check-mobile-ledger.mjs
          node scripts/check-mobile-adapters.mjs
          node scripts/check-sentry-consistency.mjs
          node scripts/check-mobile-workflow-safety.mjs
          node scripts/verify-mobile-security.mjs
