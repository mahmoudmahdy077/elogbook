name: CD

on:
  push:
    branches: [main]
    # Docs/history-only pushes never need a production deploy (Vercel free
    # tier is quota-limited; each push burns a deployment).
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.hermes/**'
      - 'specs/**'
      - 'supabase/tests/**'
      - 'scripts/verify-*.mjs'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # Superseded queued deploys are pure quota burn on a free tier: only the
  # latest main matters. Vercel deployments are atomic, so cancelling a
  # still-queued build cannot half-deploy.
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------
  # Deploy web to Vercel
  # ----------------------------------------------------------------------
  web:
    name: Deploy Web (Vercel)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [db]
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v42
        id: deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --yes'

      # A green Vercel deploy only proves the build finished. The site answered
      # 500 MIDDLEWARE_INVOCATION_FAILED for 13 days while CD stayed green, so
      # the pipeline now asks the deployed process to serve a request.
      - name: Verify the deployment serves requests
        run: |
          url="https://elogbook-web.vercel.app"
          for i in $(seq 1 12); do
            health=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url/api/health")
            login=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url/login")
            setup=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST "$url/api/setup/deploy-supabase")
            if [ "$health" = "200" ] && [ "$login" = "200" ] && [ "$setup" = "404" ]; then
              echo "live: health=$health login=$login setup=$setup"
              exit 0
            fi
            echo "attempt $i/12: health=$health login=$login setup=$setup (waiting for alias)"
            sleep 10
          done
          echo "::error::Deployed site is not serving: health=$health login=$login setup=$setup. Check the Vercel runtime logs; a boot-contract exit or a middleware failure reads as 500 here."
          exit 1

  # ----------------------------------------------------------------------
  # Push database migrations
  # ----------------------------------------------------------------------
  db:
    name: Push DB migrations
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ github.token }}
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # --include-all removed (CD-004): it re-applies every migration in the
      # directory even ones already recorded in supabase_migrations, which can
      # re-run destructively against live tables. Only unapplied migrations go
      # out now.
      - run: supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ----------------------------------------------------------------------
  # Deploy edge functions (depends on db migrations being done first)
  # ----------------------------------------------------------------------
  functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    needs: [db]
    strategy:
      matrix:
        function: [ai-insights, ai-quality, ai-gap-analysis, generate-pdf, create-checkout, payment-webhook, create-portal-session, list-invoices, webads-export]
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ github.token }}
      # --use-api bundles server-side: the default path pulls
      # public.ecr.aws/supabase/edge-runtime through Docker, which fails the
      # whole matrix with "error from registry: Data limit exceeded" when the
      # runner's anonymous pull quota is gone (CD run 44665986563).
      - run: supabase functions deploy ${{ matrix.function }} --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ----------------------------------------------------------------------
  # Mobile builds: CANONICAL workflow is deploy-mobile.yml (exact build IDs,
  # artifact download/hash, provenance, SBOM, fork-safe path). This file must
  # not build mobile independently — a second chain cannot be the release
  # artifact. (R1 canonical provenance; N8.)
  # ----------------------------------------------------------------------
