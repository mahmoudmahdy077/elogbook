name: CD

on:
  push:
    branches: [main]
    # Docs/history-only pushes never need a production deploy (Vercel free
    # tier is quota-limited; each push burns a deployment).
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.hermes/**'
      - 'specs/**'
      - 'supabase/tests/**'
      - 'scripts/verify-*.mjs'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # Superseded queued deploys are pure quota burn on a free tier: only the
  # latest main matters. Vercel deployments are atomic, so cancelling a
  # still-queued build cannot half-deploy.
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------
  # Deploy web to Vercel
  # ----------------------------------------------------------------------
  web:
    name: Deploy Web (Vercel)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v42
        id: deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --yes'
      # A green Vercel deploy means the BUILD succeeded; it says nothing about
      # whether the deployed process can boot. On 2026-11-13 the production
      # deployment succeeded while every dynamic route answered 500 (missing
      # production env var → instrumentation.ts exits 1 at boot), and nothing
      # in the pipeline noticed. Probe the deployed site so a deploy that
      # cannot serve is red here, not silently live.
      - name: Smoke test deployed site
        env:
          SITE_URL: ${{ steps.deploy.outputs.preview-url || vars.PRODUCTION_SITE_URL || 'https://elogbook-web.vercel.app' }}
        run: |
          set -uo pipefail
          probe() {
            method="$1"; path="$2"; want="$3"
            url="${SITE_URL%/}${path}"
            for attempt in $(seq 1 12); do
              code=$(curl -s -o /tmp/probe-body -w '%{http_code}' -X "$method" --max-time 20 "$url" || echo 000)
              if [ "$code" = "$want" ]; then
                echo "OK  $method $url -> $code"
                return 0
              fi
              echo "attempt $attempt/12: $method $url -> $code (want $want)"
              sleep 10
            done
            echo "::error::$method $url returned $code, expected $want"
            echo "--- response body (first 500 bytes) ---"
            head -c 500 /tmp/probe-body || true
            echo
            echo "--- deploy log ---"
            echo "Deployment: ${{ steps.deploy.outputs.preview-url }}"
            echo "See docs/env-reference.md#production-boot-contract for the required variables."
            return 1
          }
          rc=0
          probe GET /api/health 200 || rc=1
          probe GET /login 200 || rc=1
          probe POST /api/setup/deploy-supabase 404 || rc=1
          exit "$rc"

  # ----------------------------------------------------------------------
  # Push database migrations
  # ----------------------------------------------------------------------
  db:
    name: Push DB migrations
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ github.token }}
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: supabase db push --linked --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ----------------------------------------------------------------------
  # Deploy edge functions (depends on db migrations being done first)
  # ----------------------------------------------------------------------
  functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    needs: [db]
    strategy:
      matrix:
        function: [ai-insights, ai-quality, ai-gap-analysis, generate-pdf, create-checkout, payment-webhook, create-portal-session, list-invoices, webads-export]
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.1
        env:
          SUPABASE_CLI_GITHUB_TOKEN: ${{ github.token }}
      - run: supabase functions deploy ${{ matrix.function }} --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ----------------------------------------------------------------------
  # Mobile builds: CANONICAL workflow is deploy-mobile.yml (exact build IDs,
  # artifact download/hash, provenance, SBOM, fork-safe path). This file must
  # not build mobile independently — a second chain cannot be the release
  # artifact. (R1 canonical provenance; N8.)
  # ----------------------------------------------------------------------
