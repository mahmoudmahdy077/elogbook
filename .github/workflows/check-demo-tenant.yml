name: Check Demo Tenant (temp)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query demo profiles and tenants
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          q() { curl -sS -w "\nHTTP_CODE:%{http_code}\n" -X POST \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.management.v1+json" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -d "$1"; }
          q "{\"query\":\"SELECT u.email, p.tenant_id, p.role, t.slug AS tenant_slug, p.onboarding_completed FROM auth.users u LEFT JOIN public.profiles p ON p.user_id = u.id LEFT JOIN public.tenants t ON t.id = p.tenant_id WHERE u.email LIKE '%@demo.com' ORDER BY u.email;\"}"
          echo "---ALL TENANTS---"
          q "{\"query\":\"SELECT id, slug, name FROM public.tenants ORDER BY created_at DESC LIMIT 10;\"}"
