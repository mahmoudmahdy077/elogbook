name: Redeploy Vercel (temp)
on:
  workflow_dispatch:
jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel redeploy https://elogbook-web.vercel.app --yes --token "${VERCEL_TOKEN}" 2>&1 | sed 's/\btkn_\(.\{4\}\).*/\1***/' || true
