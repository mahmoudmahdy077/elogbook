name: Seed Demo Accounts (temp)
on:
  workflow_dispatch:
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 client (psql)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
      - name: Seed demo accounts, enable gate, verify
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          q() { curl -sS -w "\nHTTP_CODE:%{http_code}\n" -X POST \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.management.v1+json" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -d "$1"; }

          echo "---SEED---"
          jq -n --arg q "$(cat .github/workflows/seed-demo.sql)" '{query: $q}' > /tmp/seed.json
          q "$(cat /tmp/seed.json)"

          echo "---POOLER HOST---"
          PROJECT_JSON="$(curl -fsSL -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}")"
          POOLER_HOST="$(echo "${PROJECT_JSON}" | jq -r '.pooler.host // empty')"
          REGION="$(echo "${PROJECT_JSON}" | jq -r '.region // empty')"
          [ -n "${POOLER_HOST}" ] || POOLER_HOST="aws-0-${REGION}.pooler.supabase.com"
          echo "pooler-host=${POOLER_HOST}"

          echo "---ENABLE GATE (psql as postgres)---"
          DB_URL="${SUPABASE_DB_URL/db.${SUPABASE_PROJECT_REF}.supabase.co/${POOLER_HOST}}"
          if [[ "${DB_URL}" =~ ^([a-z]+)://([^:/@]+)(:([^@]*))?@(.*)$ ]]; then
            SCHEME="${BASH_REMATCH[1]}"; USERNAME="${BASH_REMATCH[2]}"
            PASSWORD="${BASH_REMATCH[4]:-}"; REST="${BASH_REMATCH[5]}"
            if [[ "${USERNAME}" != *.${SUPABASE_PROJECT_REF} ]]; then
              USERNAME="${USERNAME}.${SUPABASE_PROJECT_REF}"
            fi
            if [[ -n "${PASSWORD}" ]]; then
              DB_URL="${SCHEME}://${USERNAME}:${PASSWORD}@${REST}"
            else
              DB_URL="${SCHEME}://${USERNAME}@${REST}"
            fi
          fi
          PATH="/usr/lib/postgresql/17/bin:${PATH}"
          psql "${DB_URL}" -v ON_ERROR_STOP=0 -c "ALTER DATABASE postgres SET app.enable_demo_migrations = 'on';" || true
          psql "${DB_URL}" -v ON_ERROR_STOP=0 -c "ALTER ROLE postgres SET app.enable_demo_migrations = 'on';" || true

          echo "---VERIFY USERS---"
          q "{\"query\":\"SELECT email, raw_user_meta_data->>'role' AS role, raw_app_meta_data->>'tenant_id' AS tenant FROM auth.users WHERE email LIKE '%@demo.com' ORDER BY email;\"}"
          echo "---VERIFY GATE---"
          q "{\"query\":\"SELECT current_setting('app.enable_demo_migrations', true);\"}"
