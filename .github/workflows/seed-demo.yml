name: Seed Demo Accounts (temp)
on:
  workflow_dispatch:
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect NOT NULL columns and run seed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          q() { curl -sS -w "\nHTTP_CODE:%{http_code}\n" -X POST \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.management.v1+json" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -d "$1"; }
          echo "---TENANTS NOT-NULL COLS---"
          q "{\"query\":\"SELECT column_name, data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='tenants' AND is_nullable='NO' AND column_default IS NULL ORDER BY ordinal_position;\"}"
          echo "---PROFILES NOT-NULL COLS---"
          q "{\"query\":\"SELECT column_name, data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='profiles' AND is_nullable='NO' AND column_default IS NULL ORDER BY ordinal_position;\"}"
