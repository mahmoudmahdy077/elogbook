name: Check Funcs (temp)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Print live function definitions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          q() { curl -sS -w "\nHTTP_CODE:%{http_code}\n" -X POST \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.management.v1+json" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -d "$1"; }
          q "{\"query\":\"SELECT pg_get_functiondef('public.get_tenant_id()'::regprocedure) AS def;\"}"
          echo "---USER_ROLE---"
          q "{\"query\":\"SELECT pg_get_functiondef('public.get_user_role()'::regprocedure) AS def;\"}"
