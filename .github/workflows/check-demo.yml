name: Check Demo Accounts (temp)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query auth.users for demo accounts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          curl -sS -w "\nHTTP_CODE:%{http_code}\n" -X POST \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.management.v1+json" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -d "{\"query\":\"SELECT email FROM auth.users WHERE email LIKE '%@demo.com' ORDER BY email;\"}"
          echo "---GUC---"
          curl -sS -w "\nHTTP_CODE:%{http_code}\n" -X POST \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.management.v1+json" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -d "{\"query\":\"SELECT current_setting('app.enable_demo_migrations', true);\"}"
